# RAG-Anything SSE Stress Test Configuration
# Usage: locust -f tests/stress/locustfile.py --config tests/stress/locust.conf

# ── Target ──
host = http://localhost:8000

# ── User Class ──
# Only simulate the RAG query user (skip warmup if enabled)
# user_classes = [\"RAGQueryUser\"]

# ── Headless Mode (remove --headless to use web UI) ──
headless = true

# ── User Count and Spawn Rate ──
# Override via CLI: --users N --spawn-rate N
users = 20
spawn-rate = 5

# ── Test Duration ──
# Override via CLI: --run-time 5m
run-time = 5m

# ── HTML Report ──
html = tests/stress/locust_report.html

# ── CSV Stats Export ──
csv = tests/stress/locust_stats

# ── Log Level ──
loglevel = INFO
logfile = tests/stress/locust_run.log

# ── Graceful Stop ──
# Let in-flight SSE connections finish before exiting
stop-timeout = 30

# ── Advanced ──
# exit-code-on-error = 0  # Don't fail CI on sporadic errors
# expect-workers = 2       # Number of expected workers
