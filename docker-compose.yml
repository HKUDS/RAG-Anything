version: "3.8"

services:
  app:
    build:
      context: .
      target: default
    container_name: raganything-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-raganything}:${POSTGRES_PASSWORD:-raganything}@postgres:5432/${POSTGRES_DATABASE:-raganything}
      - REDIS_URI=redis://redis:6379
      # The catalog is deployment-owned. It is mounted read-only below and is
      # never supplied by an API request or browser client.
      - MODEL_PROFILE_CATALOG_FILE=/app/config/model_profiles.json
    volumes:
      - ./rag_storage:/app/rag_storage
      - ./uploads:/app/uploads
      - ./output:/app/output
      # Override MODEL_PROFILE_CATALOG_HOST_PATH at deploy time to use a
      # dedicated unified catalog; the existing vision catalog is a safe
      # backwards-compatible default.
      - ${MODEL_PROFILE_CATALOG_HOST_PATH:-./config/vision_models.json}:/app/config/model_profiles.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: raganything-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raganything}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raganything}
      POSTGRES_DB: ${POSTGRES_DATABASE:-raganything}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raganything}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: raganything-redis
    restart: unless-stopped
    volumes:
      - redisdata:/data

  nginx:
    build:
      context: .
      target: frontend
    container_name: raganything-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app

volumes:
  pgdata:
  redisdata:
