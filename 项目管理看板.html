<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG-Anything 项目管理看板</title>
<style>
:root {
  --bg: #f6f8fb; --surface: #fff; --text: #1a1d23; --text2: #5f6570;
  --text3: #9499a3; --border: #e5e7eb; --border2: #f0f1f3;
  --c-done: #10b981; --c-done-bg: #ecfdf5; --c-done-bar: #a7f3d0;
  --c-progress: #3b82f6; --c-progress-bg: #eff6ff; --c-progress-bar: #bfd6fe;
  --c-planned: #f59e0b; --c-planned-bg: #fffbeb; --c-planned-bar: #fde68a;
  --c-pending: #e5e7eb;
  --c-explore: #7c5cfc; --c-explore-bg: #f7f5ff; --c-explore-border: #7c5cfc;
  --c-design: #f59e0b; --c-design-bg: #fffdf5; --c-design-border: #f59e0b;
  --c-build: #3b82f6;  --c-build-bg: #f5f8ff;  --c-build-border: #3b82f6;
  --c-security: #10b981; --c-security-bg: #f4fbf8; --c-security-border: #10b981;
  --c-ms: #f43f5e; --c-today: #ef4444;
  --c-past: #ef4444; --c-past-bg: rgba(239,68,68,0.08);
  --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,0.04);
}
[data-theme="dark"] {
  --bg: #111827; --surface: #1f2937; --text: #f3f4f6; --text2: #9ca3af;
  --text3: #6b7280; --border: #374151; --border2: #283040;
  --c-done-bg: #064e3b; --c-progress-bg: #1e3a5f; --c-planned-bg: #78350f;
  --c-pending: #374151;
  --c-explore-bg: #1e1b4b; --c-build-bg: #172554;
  --c-design-bg: #451a03; --c-security-bg: #052e16;
  --c-past-bg: rgba(239,68,68,0.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;margin:0 auto;padding:1rem}

/* Header */
.pg-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;flex-wrap:wrap;gap:0.5rem}
.pg-hd h1{font-size:1.15rem;font-weight:700}
.pg-hd .sub{font-size:0.72rem;color:var(--text3)}
.actions{display:flex;gap:0.4rem;flex-wrap:wrap}

/* Buttons */
.btn{font-size:0.7rem;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.btn:hover{background:var(--border2);color:var(--text)}
.btn.ac{background:var(--c-progress);color:#fff;border-color:var(--c-progress)}
.btn.danger{color:var(--c-ms);border-color:var(--c-ms)}
.btn.danger:hover{background:var(--c-ms);color:#fff}
.btn.sm{font-size:0.62rem;padding:3px 8px}

/* Stats row */
.stats{display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap}
.stat{flex:1;min-width:80px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:0.6rem 0.9rem;box-shadow:var(--shadow);cursor:pointer;transition:all 0.15s}
.stat:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.stat .n{font-size:1.4rem;font-weight:700;line-height:1}
.stat .l{font-size:0.6rem;color:var(--text3);margin-top:2px}
.stat.sel{border:2px solid var(--c-progress)}

/* Toolbar */
.toolbar{display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;align-items:center}
.toolbar input[type="text"]{flex:1;min-width:150px;max-width:280px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.72rem;background:var(--surface);color:var(--text)}
.toolbar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.7rem;background:var(--surface);color:var(--text)}
.toolbar .sep{width:1px;height:20px;background:var(--border)}

/* Week tabs */
.week-tabs{display:flex;gap:0;margin-bottom:0.75rem;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.week-tab{flex:1;padding:8px;text-align:center;font-size:0.72rem;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text2);border-right:1px solid var(--border);transition:all 0.15s}
.week-tab:last-child{border-right:none}
.week-tab:hover{background:var(--border2)}
.week-tab.act{background:var(--c-progress);color:#fff}
.week-tab .wk-label{font-size:0.62rem;font-weight:400;opacity:0.8}

/* Table */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:900px;table-layout:fixed}
.tbl th{padding:8px 4px;font-size:0.65rem;font-weight:600;color:var(--text2);border-bottom:2px solid var(--border);text-align:center;position:sticky;top:0;background:var(--surface);z-index:2}
.tbl th:first-child{padding-left:12px;text-align:left;width:240px}
.tbl th.day-col{width:calc((100% - 240px) / 5)}
.tbl th.today-col{background:rgba(239,68,68,0.06);color:var(--c-today)}
.tbl th.today-col::after{content:'▼';display:block;font-size:0.5rem;margin-top:1px}
.tbl td{padding:0;border-bottom:1px solid var(--border2);height:36px}

/* Module header */
.mod-row td{padding:0}
.mod-bar{display:flex;align-items:center;padding:7px 12px;font-size:0.7rem;font-weight:700;gap:6px;cursor:pointer;user-select:none}
.mod-bar .arrow{font-size:0.6rem;transition:transform 0.2s;width:12px;text-align:center}
.mod-bar.collapsed .arrow{transform:rotate(-90deg)}
.mod-bar .dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.mod-bar .cnt{font-size:0.6rem;font-weight:400;color:var(--text3);margin-left:auto}
.mod-c1 .mod-bar{border-left:4px solid var(--c-explore-border);background:var(--c-explore-bg)}
.mod-c2 .mod-bar{border-left:4px solid var(--c-build-border);background:var(--c-build-bg)}
.mod-c3 .mod-bar{border-left:4px solid var(--c-design-border);background:var(--c-design-bg)}
.mod-c4 .mod-bar{border-left:4px solid var(--c-security-border);background:var(--c-security-bg)}
[data-theme="dark"] .mod-c1 .mod-bar{background:color-mix(in srgb, var(--c-explore-bg) 40%, var(--bg))}
[data-theme="dark"] .mod-c2 .mod-bar{background:color-mix(in srgb, var(--c-build-bg) 40%, var(--bg))}
[data-theme="dark"] .mod-c3 .mod-bar{background:color-mix(in srgb, var(--c-design-bg) 40%, var(--bg))}
[data-theme="dark"] .mod-c4 .mod-bar{background:color-mix(in srgb, var(--c-security-bg) 40%, var(--bg))}

/* Task cells */
.task-name{padding:4px 12px;font-size:0.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:5px}
.task-name .status-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.task-name .status-dot.s-done{background:var(--c-done)}
.task-name .status-dot.s-progress{background:var(--c-progress)}
.task-name .status-dot.s-planned{background:var(--c-planned)}
.task-name .status-dot.s-pending{background:var(--c-pending)}
.task-name:hover{color:var(--c-progress);cursor:pointer}

.day-cell{text-align:center;cursor:pointer;transition:background 0.1s;position:relative}
.day-cell:hover{background:rgba(59,130,246,0.06)}
.day-cell.done{background:var(--c-done-bg)}
.day-cell.done:hover{background:rgba(16,185,129,0.12)}
.day-cell.today-col{background:rgba(239,68,68,0.03)}
.day-cell .check{font-size:0.75rem;color:var(--c-done);font-weight:700}

/* Progress bar */
.prog-wrap{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:2px}
.prog-bar{height:100%;border-radius:2px;transition:width 0.3s}
.prog-bar.done{background:var(--c-done)}
.prog-bar.progress{background:var(--c-progress)}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,0.15);max-width:500px;width:90%;max-height:80vh;overflow-y:auto;padding:1.2rem}
.modal h3{font-size:0.95rem;margin-bottom:0.75rem}
.modal label{font-size:0.68rem;color:var(--text2);display:block;margin-bottom:3px}
.modal input,.modal textarea,.modal select{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.72rem;margin-bottom:0.6rem;background:var(--surface);color:var(--text)}
.modal textarea{min-height:80px;resize:vertical}
.modal .btn-row{display:flex;gap:0.5rem;justify-content:flex-end;margin-top:0.5rem}

/* Toast */
.toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 18px;border-radius:8px;font-size:0.72rem;z-index:200;opacity:0;transition:opacity 0.3s;pointer-events:none}
.toast.show{opacity:1}

/* Click animation */
@keyframes cellPop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.day-cell.popping .check{animation:cellPop 0.25s ease}
.day-cell.popping{background:rgba(59,130,246,0.15) !important}

/* Empty state */
.empty-state{padding:3rem 1rem;text-align:center;color:var(--text3)}
.empty-state .icon{font-size:2rem;margin-bottom:0.5rem;opacity:0.6}
.empty-state .msg{font-size:0.8rem;font-weight:500;margin-bottom:0.25rem}
.empty-state .hint{font-size:0.65rem}

/* Responsive */
@media(max-width:900px){.tbl-wrap{overflow-x:auto}.task-name{font-size:0.62rem}}
</style>
</head>
<body>
<div class="wrap">

<!-- Header -->
<div class="pg-hd">
  <div>
    <h1>📋 RAG-Anything 项目管理看板</h1>
    <p class="sub">实现完成 = 代码与本地证据齐备；云端、真实 PG、Worker 与浏览器验收见任务备注 · 点击日期格可调整记录</p>
  </div>
  <div class="actions">
    <button class="btn" onclick="openAddTaskModal()" title="Ctrl+N">➕ 添加任务</button>
    <button class="btn" id="bulkBtn" onclick="toggleBulkMode()">☑️ 批量操作</button>
    <button class="btn" onclick="exportData()">📥 导出JSON</button>
    <button class="btn" onclick="exportMarkdown()">📝 导出报告</button>
    <button class="btn" onclick="importData()">📤 导入</button>
    <button class="btn" onclick="undoLast()" id="undoBtn" disabled>↩ 撤销</button>
    <button class="btn" onclick="toggleTheme()">🌓</button>
    <button class="btn danger" onclick="resetAll()">🔄 重置</button>
  </div>
</div>

<!-- Stats -->
<div class="stats" id="statsRow"></div>

<!-- Toolbar -->
<div class="toolbar">
  <input type="text" id="searchInput" placeholder="🔍 搜索任务名称..." oninput="render()">
  <select id="filterModule" onchange="render()">
    <option value="">全部模块</option>
  </select>
  <select id="filterStatus" onchange="render()">
    <option value="">全部状态</option>
    <option value="done">✅ 实现完成</option>
    <option value="progress">🔄 进行中</option>
    <option value="planned">🎯 计划中</option>
    <option value="pending">⬜ 未开始</option>
  </select>
  <span class="sep"></span>
  <span style="font-size:0.65rem;color:var(--text3)" id="saveIndicator">💾 已自动保存</span>
  <span class="sep"></span>
  <span style="display:flex;align-items:center;gap:6px;font-size:0.65rem;color:var(--text2)" id="weekSummary"></span>
  <span class="sep"></span>
  <span style="font-size:0.62rem;color:var(--text3)">⌨ 1-6阶段 | Ctrl+Z撤销 | Ctrl+N添加 | Esc关闭</span>
</div>

<!-- Bulk Action Bar -->
<div id="bulkBar" style="display:none;background:var(--c-progress-bg);border:1px solid var(--c-progress);border-radius:8px;padding:8px 12px;margin-bottom:0.75rem;align-items:center;gap:8px;">
  <span style="font-size:0.7rem;font-weight:600;color:var(--c-progress)">☑️ 批量模式 — 点击任务行选择</span>
  <span style="font-size:0.65rem;color:var(--text2)" id="bulkCount">已选 0 个</span>
  <button class="btn sm ac" onclick="bulkComplete()">✅ 标记为本周实现完成</button>
  <button class="btn sm" onclick="toggleBulkMode()">退出批量模式</button>
</div>

<!-- Week Tabs -->
<div class="week-tabs" id="weekTabs"></div>

<!-- Main Table -->
<div class="tbl-wrap">
<table class="tbl">
<thead><tr><th>任务名称</th><th class="day-col">周一</th><th class="day-col">周二</th><th class="day-col">周三</th><th class="day-col">周四</th><th class="day-col">周五</th></tr></thead>
<tbody id="tableBody"></tbody>
</table>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

</div>

<script>
// ═══════════════════ DATA ═══════════════════
const BOARD_VERSION = '2026-08-10-current-delivery';
const WEEKS = [
  {id:1, label:'第 1 阶段', date:'8.10 — 8.14', status:'current', days:['8.10 周一','8.11 周二','8.12 周三','8.13 周四','8.14 周五']},
  {id:2, label:'第 2 阶段', date:'8.17 — 8.21', status:'future', days:['8.17 周一','8.18 周二','8.19 周三','8.20 周四','8.21 周五']},
  {id:3, label:'第 3 阶段', date:'8.24 — 8.28', status:'future', days:['8.24 周一','8.25 周二','8.26 周三','8.27 周四','8.28 周五']},
  {id:4, label:'第 4 阶段', date:'8.31 — 9.04', status:'future', days:['8.31 周一','9.01 周二','9.02 周三','9.03 周四','9.04 周五']},
  {id:5, label:'第 5 阶段', date:'9.07 — 9.11', status:'future', days:['9.07 周一','9.08 周二','9.09 周三','9.10 周四','9.11 周五']},
  {id:6, label:'第 6 阶段', date:'9.14 — 9.18', status:'future', days:['9.14 周一','9.15 周二','9.16 周三','9.17 周四','9.18 周五']},
];

const MODULES = [
  {id:'foundation', name:'一、认证、权限与设置基础', cls:'mod-c1', tasks:[
    {id:'u1', name:'五级 RBAC 与持久会话刷新', desc:'PostgreSQL 认证、五级角色、refresh token family 轮转与前端 401 重放。', deps:[], week:1, day:1, status:'done', note:'实现与本地证据完成；真实生产 PostgreSQL/浏览器验收仍需受控环境。'},
    {id:'u2', name:'知识库成员授权与显示名称', desc:'KB 级 read/operate 授权、kb:manage 作用域、显示名称乐观锁更新与前端抽屉。', deps:['u1'], week:1, day:2, status:'done', note:'后端 42、前端 166、strict/diff 已通过；迁移 033/034 与五角色浏览器验收待执行。'},
    {id:'u3', name:'个人设置与分级能力投影', desc:'/preferences、/admin/platform、按角色隐藏分区与 API 能力，旧快照保持不变。', deps:['u1'], week:1, day:3, status:'done', note:'实现已在工作区；提交后需做浏览器与 API 验收。'},
    {id:'u4', name:'知识库级上传默认与单次快照', desc:'平台 -> 个人 -> KB -> 单次覆盖，解析器/分块策略按任务冻结，历史任务不回写。', deps:['u2','u3'], week:1, day:4, status:'done', note:'聚焦后端/前端测试与 strict 已通过；真实 PostgreSQL 多角色上传验收待执行。'},
  ]},
  {id:'ingestion', name:'二、解析、上传与 Worker 持久化', cls:'mod-c2', tasks:[
    {id:'u5', name:'按文件类型解析器与分块策略目录', desc:'PDF/Office/图片 per-type 覆盖、6 种分块策略、未安装解析器置灰与渐进式折叠。', deps:['u4'], week:1, day:5, status:'done', note:'相关后端/前端聚焦测试与 py_compile 已通过；Vite 构建和重启后实测待环境恢复。'},
    {id:'u6', name:'上传取消、租约与 PostgreSQL 瞬断韧性', desc:'cancelling 状态、worker 终止、claim fencing、心跳、stale 接管与退避恢复。', deps:['u4'], week:2, day:1, status:'done', note:'实现及聚焦测试完成；真实多进程故障注入与迁移 024 部署验收待执行。'},
    {id:'u7', name:'Embedding identity 与 legacy 向量清理', desc:'按 KB 绑定 embedding identity、阻止旧无后缀向量存储、恢复存量 KB 查询。', deps:['u4'], week:2, day:2, status:'done', note:'本地 PG、脚本自检、focused tests 和 strict 已通过；生产迁移须先备份并预览。'},
    {id:'u8', name:'Embedding cache 事件循环安全', desc:'共享 asyncpg pool 留在 Worker event loop，缓存读写失败降级为 miss/no-op。', deps:['u7'], week:2, day:3, status:'done', note:'62 项 focused tests、py_compile、diff/strict 已通过；云端新 PDF 向量写入验收待执行。'},
    {id:'u9', name:'NanoVectorDB Worker 快照持久化', desc:'Worker 写入后仅跳过旧缓存实例的三类 VDB 持久化回调，防止空快照覆盖新向量。', deps:['u8'], week:2, day:4, status:'done', note:'40 项 Worker/持久化测试与 12 项缓存回归已通过；云端 KB 3 新 PDF、vector_count 与自动标签验收待执行。'},
    {id:'u10', name:'OpenDataLoader / Marker 解析运行时', desc:'独立解析器运行时、模型缓存挂载、Docker 构建上下文和 PDF 端到端路径。', deps:['u5'], week:2, day:5, status:'progress', note:'镜像/缓存准备与聚焦测试完成；真实 PDF 容器 smoke 与网络缓存问题仍待云端确认。'},
  ]},
  {id:'retrieval', name:'三、检索、媒体与智能体链路', cls:'mod-c3', tasks:[
    {id:'u11', name:'视频语义分段 v2', desc:'中文语义段、时间引用、失败补偿、批量任务隔离与历史成品不回填。', deps:['u7'], week:3, day:1, status:'done', note:'聚焦测试、迁移、认证和入口隔离已通过；真实 Worker/PG 样片与 Recall@5/MRR 验收待执行。'},
    {id:'u12', name:'视频分段吞吐优化', desc:'VIDEO_SEGMENT_CONCURRENT 受控并发、阶段耗时指标、确定性写入与延迟整文档落盘。', deps:['u11'], week:3, day:2, status:'done', note:'聚焦 104 通过、2 跳过；真实时长收益和检索验收待部署验证。'},
    {id:'u13', name:'媒体召回预算与会话摘要 Schema', desc:'独立媒体预算、超时保留已验证图片、幂等迁移 027 与摘要列/索引。', deps:['u7'], week:3, day:3, status:'done', note:'本地 PostgreSQL 已连续执行迁移并核验；重启后的真实问答验收待执行。'},
    {id:'u14', name:'混合检索、RRF 与图谱布局', desc:'默认 hybrid 用户检索选项快照、RRF 降级、图谱深度控制与 orderly graph layout。', deps:['u11'], week:3, day:4, status:'progress', note:'核心实现可用；active change 仍有待办，性能与真实多进程检索验收待收敛。'},
    {id:'u15', name:'视觉模型配置与 KB 视觉向量重建', desc:'模型目录、请求快照、作用域缓存、失败保留旧索引和重试入口。', deps:['u14'], week:3, day:5, status:'progress', note:'工作区实现已落地；生产迁移、真实 PostgreSQL 多进程和视觉 Embedding 凭据验收待执行。'},

const STORAGE_KEY = 'raganything_pm_data_2026_08';
let appData;
let currentWeek = 1; // 2026-08-10 is the current delivery phase
let undoStack = [];
let collapsedModules = new Set();
let lastToggledCell = null; // For click animation {taskId, weekId, dayIdx}

function getDefaultData() {
  const data = { version: BOARD_VERSION, completions: {}, notes: {}, deletedTasks: [], customTasks: [] };
  // Auto-populate completions for all tasks with status 'done' based on their planned week+day
  MODULES.forEach(m => m.tasks.forEach(t => {
    if (t.status === 'done' && t.week >= 1 && t.day >= 1) {
      data.completions[t.id] = data.completions[t.id] || [];
      const key = `${t.week}-${t.day}`;
      if (!data.completions[t.id].includes(key)) {
        data.completions[t.id].push(key);
      }
    }
    if (t.note) data.notes[t.id] = t.note;
  }));
  return data;
}

// ═══════════════════ HASH STORAGE ═══════════════════
// 主要存储：URL hash（刷新不丢失）。localStorage 作为辅助同步。
function hashSave(data) {
  try {
    const json = JSON.stringify(data);
    const encoded = btoa(unescape(encodeURIComponent(json)));
    // 静默更新 hash，不触发 hashchange 事件
    history.replaceState(null, '', '#' + encoded);
    return true;
  } catch(e) {
    console.error('Hash 保存失败:', e);
    return false;
  }
}

function hashLoad() {
  try {
    const hash = location.hash.slice(1); // 去掉开头的 #
    if (!hash) return null;
    const json = decodeURIComponent(escape(atob(hash)));
    return JSON.parse(json);
  } catch(e) {
    console.error('Hash 数据解析失败:', e);
    return null;
  }
}

function loadData() {
  // 1. 优先从 localStorage 加载
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (data.version === BOARD_VERSION) return normalizeData(data);
    }
  } catch(e) {
    console.error('localStorage 数据加载失败:', e);
  }

  // 2. 从 URL hash 加载
  const hashData = hashLoad();
  if (hashData && hashData.version === BOARD_VERSION && hashData.completions) {
    console.log('从 URL hash 恢复数据');
    return normalizeData(hashData);
  }

  // 3. 返回默认数据
  return getDefaultData();
}

function normalizeData(data) {
  // 仅在数据为空（首次使用）时，为 status='done' 的任务填充实现完成记录
  // 已有数据时尊重用户手工调整，不强制覆写
  data.version = BOARD_VERSION;
  data.completions = data.completions && typeof data.completions === 'object' ? data.completions : {};
  data.deletedTasks = Array.isArray(data.deletedTasks) ? data.deletedTasks : [];
  data.customTasks = Array.isArray(data.customTasks) ? data.customTasks : [];
  const staticIds = new Set(MODULES.flatMap(m => m.tasks.map(t => t.id)));
  data.customTasks = data.customTasks.filter(ct => ct && typeof ct.id === 'string' && ct.modId && MODULES.some(m => m.id === ct.modId));
  const validIds = new Set([...staticIds, ...data.customTasks.map(ct => ct.id)]);
  const validWeeks = new Set(WEEKS.map(w => w.id));
  data.completions = Object.fromEntries(Object.entries(data.completions).flatMap(([taskId, keys]) => {
    if (!validIds.has(taskId) || !Array.isArray(keys)) return [];
    const validKeys = [...new Set(keys)].filter(key => {
      const match = /^(\d+)-([1-5])$/.exec(key);
      return match && validWeeks.has(Number(match[1]));
    });
    return validKeys.length ? [[taskId, validKeys]] : [];
  }));
  data.deletedTasks = data.deletedTasks.filter(id => validIds.has(id));
  const hasExistingData = Object.keys(data.completions).length > 0 || data.customTasks.length > 0;
  if (!hasExistingData) {
    MODULES.forEach(m => m.tasks.forEach(t => {
      if (t.status === 'done' && t.week >= 1 && t.day >= 1) {
        data.completions[t.id] = data.completions[t.id] || [];
        const key = `${t.week}-${t.day}`;
        if (!data.completions[t.id].includes(key)) {
          data.completions[t.id].push(key);
        }
      }
    }));
  }
  data.notes = data.notes && typeof data.notes === 'object' ? data.notes : {};
  data.notes = Object.fromEntries(Object.entries(data.notes).filter(([taskId]) => validIds.has(taskId)));
  MODULES.forEach(m => m.tasks.forEach(t => {
    if (t.note && !data.notes[t.id]) data.notes[t.id] = t.note;
  }));
  // 恢复自定义任务到模块中（刷新后 MODULES 被重建，需从持久化数据恢复）
  (data.customTasks || []).forEach(ct => {
    const mod = MODULES.find(m => m.id === ct.modId);
    if (mod && !mod.tasks.find(t => t.id === ct.id)) {
      mod.tasks.push({
        id: ct.id, name: ct.name, desc: ct.desc || '',
        deps: ct.deps || [], week: ct.week, day: ct.day,
        status: ct.status, custom: true
      });
    }
  });
  return data;
}

let saveFailedShown = false;
function saveData() {
  // 主存储：URL hash（刷新不丢失）
  const ok = hashSave(appData);

  // 辅助存储：localStorage
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    document.getElementById('saveIndicator').textContent = '💾 已自动保存 ' + new Date().toLocaleTimeString();
    saveFailedShown = false;
  } catch(e) {
    if (ok) {
      document.getElementById('saveIndicator').textContent = '💾 已保存(hash) ' + new Date().toLocaleTimeString();
    } else {
      document.getElementById('saveIndicator').textContent = '⚠️ 保存失败: ' + (e.message || '存储异常');
      console.error('保存数据失败:', e);
      if (!saveFailedShown) {
        saveFailedShown = true;
        showToast('⚠️ 自动保存失败！请检查浏览器存储空间');
      }
    }
  }
}

// 初始化数据（在所有存储函数定义之后）
appData = loadData();

// ═══════════════════ DATE HELPERS ═══════════════════
function parseWeekDate(weekId, dayIdx) {
  // The delivery plan is anchored to 2026-08-10, not the viewer's calendar year.
  const week = WEEKS.find(w => w.id === weekId);
  if (!week) return null;
  const dateStr = week.date.split(' — ')[0];
  const [month, day] = dateStr.split('.').map(Number);
  const year = 2026;
  // dayIdx is 1-5 (Mon-Fri); the start date is Monday
  return new Date(year, month - 1, day + dayIdx - 1);
}

function isDatePast(weekId, dayIdx) {
  const d = parseWeekDate(weekId, dayIdx);
  if (!d) return false;
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  d.setHours(0, 0, 0, 0);
  return d < today;
}

function isDateToday(weekId, dayIdx) {
  const d = parseWeekDate(weekId, dayIdx);
  if (!d) return false;
  const today = new Date();
  return d.getFullYear() === today.getFullYear() &&
         d.getMonth() === today.getMonth() &&
         d.getDate() === today.getDate();
}

function getTodayWeekId() {
  for (let d = 1; d <= 5; d++) {
    for (const w of WEEKS) {
      if (isDateToday(w.id, d)) return w.id;
    }
  }
  return -1;
}

// ═══════════════════ RENDER ═══════════════════
function getTaskCompletion(taskId) {
  return appData.completions[taskId] || [];
}

const STATUS_LABELS = {
  done: '✅ 实现完成',
  progress: '🔄 进行中',
  planned: '🎯 计划中',
  pending: '⬜ 未开始'
};

function getDisplayStatus(task) {
  const comps = getTaskCompletion(task.id);
  return comps.length > 0 || task.status === 'done' ? 'done' : task.status;
}

function isCompleted(taskId, weekId, dayIdx) {
  return getTaskCompletion(taskId).includes(`${weekId}-${dayIdx}`);
}

function toggleCompletion(taskId, weekId, dayIdx) {
  const key = `${weekId}-${dayIdx}`;
  const completions = appData.completions[taskId] || [];
  appData.completions[taskId] = completions;

  if (completions.includes(key)) {
    completions.splice(completions.indexOf(key), 1);
  } else {
    completions.push(key);
  }
  undoStack.push({taskId, weekId, dayIdx, key, action: completions.includes(key) ? 'add' : 'remove'});
  if (undoStack.length > 50) undoStack.shift();
  document.getElementById('undoBtn').disabled = false;
  lastToggledCell = {taskId, weekId, dayIdx};
  render();  // 先刷新 UI，确保用户立即可见变化
  saveData(); // 再持久化，存储失败不影响 UI 响应
}

function undoLast() {
  if (!undoStack.length) return;
  const last = undoStack.pop();
  if (last.action === 'bulk') {
    last.added.forEach(({taskId, key}) => {
      const completions = appData.completions[taskId] || [];
      const idx = completions.indexOf(key);
      if (idx >= 0) completions.splice(idx, 1);
      if (!completions.length) delete appData.completions[taskId];
    });
    if (!undoStack.length) document.getElementById('undoBtn').disabled = true;
    render();
    saveData();
    showToast('已撤销批量实现完成');
    return;
  }
  const completions = appData.completions[last.taskId] || [];
  if (last.action === 'add') {
    completions.splice(completions.indexOf(last.key), 1);
  } else {
    completions.push(last.key);
  }
  if (!undoStack.length) document.getElementById('undoBtn').disabled = true;
  render();
  saveData();
  showToast('已撤销: ' + last.key);
}

function getTaskNote(taskId) {
  return appData.notes[taskId] || '';
}

function setTaskNote(taskId, note) {
  appData.notes[taskId] = note;
  saveData();
}

function getEffectiveStatus(task, weekId, dayIdx) {
  // Check if completed on this or earlier day
  for (let w = 1; w <= weekId; w++) {
    const maxDay = (w === weekId) ? dayIdx : 5;
    for (let d = 1; d <= maxDay; d++) {
      if (isCompleted(task.id, w, d)) return 'done';
    }
  }
  // Check progress from original status
  if (task.status === 'done') return 'done';
  if (task.status === 'progress') return 'progress';
  if (task.status === 'planned') return 'planned';
  return 'pending';
}

function render() {
  const search = (document.getElementById('searchInput').value || '').toLowerCase();
  const filterMod = document.getElementById('filterModule').value;
  const filterStat = document.getElementById('filterStatus').value;

  // Stats and filtering share getDisplayStatus so implementation status is consistent.
  let totalDone = 0, totalProgress = 0, totalPlanned = 0, totalPending = 0;
  MODULES.forEach(m => m.tasks.forEach(t => {
    const status = getDisplayStatus(t);
    if (status === 'done') totalDone++;
    else if (status === 'progress') totalProgress++;
    else if (status === 'planned') totalPlanned++;
    else totalPending++;
  }));
  const total = totalDone + totalProgress + totalPlanned + totalPending;

  const activeStatus = document.getElementById('filterStatus').value;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat ${activeStatus==='done'?'sel':''}" onclick="setFilter('status','done')"><div class="n" style="color:var(--c-done)">${totalDone}</div><div class="l">✅ 实现完成</div></div>
    <div class="stat ${activeStatus==='progress'?'sel':''}" onclick="setFilter('status','progress')"><div class="n" style="color:var(--c-progress)">${totalProgress}</div><div class="l">🔄 进行中</div></div>
    <div class="stat ${activeStatus==='planned'?'sel':''}" onclick="setFilter('status','planned')"><div class="n" style="color:var(--c-planned)">${totalPlanned}</div><div class="l">🎯 计划中</div></div>
    <div class="stat ${activeStatus==='pending'?'sel':''}" onclick="setFilter('status','pending')"><div class="n" style="color:var(--text3)">${totalPending}</div><div class="l">⬜ 未开始</div></div>
    <div class="stat"><div class="n">${total}</div><div class="l">📊 总任务</div>
      <div class="prog-wrap"><div class="prog-bar done" style="width:${total?(totalDone/total*100):0}%"></div></div></div>
  `;

  // Module filter options
  const modSel = document.getElementById('filterModule');
  if (modSel.options.length <= 1) {
    MODULES.forEach(m => { const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; modSel.appendChild(o); });
  }

  // Week tabs
  const todayWeek = getTodayWeekId();
  document.getElementById('weekTabs').innerHTML = WEEKS.map(w => `
    <div class="week-tab ${w.id===currentWeek?'act':''}" onclick="switchWeek(${w.id})">
      ${w.label}${w.id===todayWeek?' 📍':''}
    </div>
  `).join('');

  // Build table
  let html = '';
  MODULES.forEach(mod => {
    const visibleTasks = mod.tasks.filter(t => {
      if (appData.deletedTasks.includes(t.id)) return false;
      if (search && !t.name.toLowerCase().includes(search) && !t.desc.toLowerCase().includes(search)) return false;
      if (filterMod && mod.id !== filterMod) return false;
      if (filterStat) {
        if (getDisplayStatus(t) !== filterStat) return false;
      }
      // 远期任务(week=0)在所有周显示
      if (t.week === 0 && currentWeek >= 1) return true;
      return true;
    });
    if (!visibleTasks.length && (search || filterMod || filterStat)) return;

    const isCollapsed = collapsedModules.has(mod.id);
    const modDone = visibleTasks.filter(t => getDisplayStatus(t) === 'done').length;
    html += `<tr class="mod-row ${mod.cls}"><td colspan="6">
      <div class="mod-bar ${isCollapsed?'collapsed':''}" onclick="toggleModule('${mod.id}')">
        <span class="arrow">▼</span><span class="dot"></span>${mod.name}
        <span class="cnt">${modDone}/${visibleTasks.length} 实现完成</span>
      </div></td></tr>`;

    if (isCollapsed) return;

    visibleTasks.forEach(t => {
      const comps = getTaskCompletion(t.id);
      const effectiveStatus = getDisplayStatus(t);
      const statusCls = effectiveStatus === 'done' ? 's-done' : effectiveStatus === 'progress' ? 's-progress' : effectiveStatus === 'planned' ? 's-planned' : 's-pending';
      const note = getTaskNote(t.id);
      const hasNote = note ? ' 📝' : '';
      const isSelected = bulkMode && selectedTasks.has(t.id);
      const isCustom = t.custom;
      html += `<tr class="task-row" data-task="${t.id}" data-mod="${mod.id}" style="${isSelected?'outline:2px solid var(--c-progress);outline-offset:-2px;background:var(--c-progress-bg)':''}">
        <td class="task-name" onclick="${bulkMode?`toggleTaskSelect('${t.id}')`:`openTaskDetail('${t.id}')`}" title="${t.desc}">
          ${bulkMode?`<input type="checkbox" ${isSelected?'checked':''} style="pointer-events:none;margin-right:4px">`:''}
          <span class="status-dot ${statusCls}"></span>${t.name}${hasNote}${isCustom?' 🏷️':''}
        </td>`;
      for (let d = 1; d <= 5; d++) {
        const done = isCompleted(t.id, currentWeek, d);
        const isFutureDate = t.week === 0; // 远期任务无具体日期
        const isPast = !isFutureDate && isDatePast(currentWeek, d);
        const isToday = !isFutureDate && isDateToday(currentWeek, d);
        const ms = MILESTONES.find(m => m.week === currentWeek && m.day === d);
        if (isFutureDate) {
          html += `<td class="day-cell" style="cursor:default;opacity:0.3" title="远期规划，暂无排期">—</td>`;
        } else {
          const isPopping = lastToggledCell && lastToggledCell.taskId === t.id && lastToggledCell.weekId === currentWeek && lastToggledCell.dayIdx === d;
          html += `<td class="day-cell ${done?'done':''} ${isPast&&!done?'past':''} ${isToday?'today-col':''} ${isPopping?'popping':''}"
            onclick="toggleCompletion('${t.id}',${currentWeek},${d})"
            oncontextmenu="event.preventDefault();openNoteModal('${t.id}')"
            title="${isToday?'📍 今天 · ':''}点击标记实现完成 · 右键添加备注${ms?' · 🏁 '+ms.label:''}">${done?'✅':''}${ms?'<span style="font-size:0.55rem;color:var(--c-ms);font-weight:700">🏁</span>':''}</td>`;
        }
      }
      html += '</tr>';
    });
  });

  // Show empty state if no tasks rendered
  if (!html.trim()) {
    html = `<tr><td colspan="6"><div class="empty-state">
      <div class="icon">🔍</div><div class="msg">没有匹配的任务</div>
      <div class="hint">尝试调整搜索条件或筛选器</div>
    </div></td></tr>`;
  }

  document.getElementById('tableBody').innerHTML = html;
  lastToggledCell = null; // Clear animation trigger after render
  document.getElementById('undoBtn').disabled = !undoStack.length;
  // Highlight today's column in header
  const thCells = document.querySelectorAll('.tbl thead th.day-col');
  thCells.forEach((th, idx) => {
    const dayIdx = idx + 1;
    th.classList.toggle('today-col', isDateToday(currentWeek, dayIdx));
  });
  // Update bulk count
  const bulkCnt = document.getElementById('bulkCount');
  if (bulkCnt) bulkCnt.textContent = `已选 ${selectedTasks.size} 个`;
  // Update week summary
  const ws = getWeekSummary(currentWeek);
  const wsEl = document.getElementById('weekSummary');
  if (wsEl) wsEl.innerHTML = `${WEEKS[currentWeek-1].label} 实现完成: ${ws.done}/${ws.total} (${ws.pct}%)<div class="prog-wrap" style="margin-top:4px;width:100px"><div class="prog-bar done" style="width:${ws.pct}%"></div></div>`;
}

function switchWeek(wid) { currentWeek = wid; render(); }
function toggleModule(mid) { collapsedModules.has(mid) ? collapsedModules.delete(mid) : collapsedModules.add(mid); render(); }

function setFilter(type, val) {
  if (type === 'status') {
    const sel = document.getElementById('filterStatus');
    // Toggle: clicking the active filter clears it
    if (sel.value === val) { sel.value = ''; }
    else { sel.value = val; }
  }
  render();
}

    ${depNames.length ? `<label>依赖任务</label><p style="font-size:0.68rem;color:var(--text3)">${depNames.join('<br>')}</p>` : ''}
    <label>备注</label>
    <textarea id="noteText" placeholder="添加备注...">${note}</textarea>
    <div class="btn-row">
      <button class="btn danger" onclick="deleteTask('${taskId}')">🗑 删除任务</button>
      <span style="flex:1"></span>
      <button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn ac" onclick="saveNote('${taskId}')">💾 保存备注</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function openNoteModal(taskId) {
  openTaskDetail(taskId);
}

function saveNote(taskId) {
  const text = document.getElementById('noteText').value;
  setTaskNote(taskId, text);
  closeModal();
  render();
  showToast('备注已保存');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function findTask(id) {
  for (const m of MODULES) for (const t of m.tasks) if (t.id === id) return t;
  return null;
}

// ═══════════════════ ACTIONS ═══════════════════
function exportData() {
  const exportObj = {
    exportTime: new Date().toISOString(),
    completions: appData.completions,
    notes: appData.notes,
    version: BOARD_VERSION,
    deletedTasks: appData.deletedTasks,
    customTasks: appData.customTasks
  };
  const blob = new Blob([JSON.stringify(exportObj, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rag-pm-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        if (imported.version === BOARD_VERSION && imported.completions && imported.notes) {
          if (confirm(`导入数据包含 ${Object.keys(imported.completions).length} 个任务的实现完成记录。确认导入？`)) {
            appData = normalizeData({
              version: imported.version,
              completions: imported.completions,
              notes: imported.notes,
              deletedTasks: imported.deletedTasks,
              customTasks: imported.customTasks
            });
            render();
            saveData();
            showToast('数据已导入');
          }
        } else {
          showToast('无效或版本不匹配的导入文件');
        }
      } catch(e) { showToast('文件解析失败'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAll() {
  if (confirm('确定要重置所有数据？此操作不可撤销！')) {
    appData = getDefaultData();
    undoStack = [];
    render();
    saveData();
    showToast('已重置为默认状态');
  }
}

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? '' : 'dark');
  localStorage.setItem('raganything_pm_theme', current === 'dark' ? 'light' : 'dark');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ═══════════════════ KEYBOARD SHORTCUTS ═══════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undoLast(); }
  if (e.key === 'Escape') closeModal();
  if (e.key === '1') switchWeek(1);
  if (e.key === '2') switchWeek(2);
  if (e.key === '3') switchWeek(3);
  if (e.key === '4') switchWeek(4);
  if (e.key === '5') switchWeek(5);
  if (e.key === '6') switchWeek(6);
  if (e.key === 'f' && e.ctrlKey) { e.preventDefault(); document.getElementById('searchInput').focus(); }
  if (e.key === 'n' && e.ctrlKey) { e.preventDefault(); openAddTaskModal(); }
});

// ═══════════════════ EXTENDED: Week Summary ═══════════════════
function getWeekSummary(weekId) {
  let done = 0, total = 0;
  MODULES.forEach(m => m.tasks.forEach(t => {
    total++;
    for (let d = 1; d <= 5; d++) if (isCompleted(t.id, weekId, d)) { done++; break; }
  }));
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}

// ═══════════════════ EXTENDED: Bulk Complete ═══════════════════
let bulkMode = false;
let selectedTasks = new Set();

function toggleBulkMode() {
  bulkMode = !bulkMode;
  selectedTasks.clear();
  document.getElementById('bulkBar').style.display = bulkMode ? 'flex' : 'none';
  document.getElementById('bulkBtn').classList.toggle('ac', bulkMode);
  render();
}

function toggleTaskSelect(taskId) {
  if (!bulkMode) return;
  selectedTasks.has(taskId) ? selectedTasks.delete(taskId) : selectedTasks.add(taskId);
  render();
}

function bulkComplete() {
  if (!selectedTasks.size) return;
  const count = selectedTasks.size;
  const weekId = currentWeek;
  const today = new Date().getDay(); // 0=Sun, 1=Mon...
  const dayIdx = today >= 1 && today <= 5 ? today : 1;
  const added = [];
  selectedTasks.forEach(tid => {
    const key = `${weekId}-${dayIdx}`;
    const completions = appData.completions[tid] || [];
    appData.completions[tid] = completions;
    if (!completions.includes(key)) {
      completions.push(key);
      added.push({taskId: tid, key});
    }
  });
  undoStack.push({action:'bulk', added, weekId, dayIdx});
  if (undoStack.length > 50) undoStack.shift();
  document.getElementById('undoBtn').disabled = false;
  selectedTasks.clear();
  render();
  saveData();
  showToast(`✅ 批量标记 ${count} 个任务为实现完成`);
}

// ═══════════════════ EXTENDED: Add Custom Task ═══════════════════
function openAddTaskModal() {
  document.getElementById('modalContent').innerHTML = `
    <h3>➕ 添加自定义任务</h3>
    <label>任务名称 *</label><input type="text" id="newTaskName" placeholder="输入任务名称">
    <label>描述</label><textarea id="newTaskDesc" placeholder="任务描述（可选）"></textarea>
    <label>所属模块</label><select id="newTaskMod">${MODULES.map(m=>`<option value="${m.id}">${m.name}</option>`).join('')}</select>
    <label>计划完成周</label><select id="newTaskWeek">${WEEKS.map(w=>`<option value="${w.id}" ${w.id===currentWeek?'selected':''}>${w.label} (${w.date})</option>`).join('')}</select>
    <label>计划完成日</label><select id="newTaskDay">${['周一','周二','周三','周四','周五'].map((d,i)=>`<option value="${i+1}">${d}</option>`).join('')}</select>
    <label>状态</label><select id="newTaskStatus"><option value="planned">🎯 计划中</option><option value="progress">🔄 进行中</option><option value="done">✅ 实现完成</option></select>
    <div class="btn-row">
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn ac" onclick="addCustomTask()">✅ 添加任务</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
}

function addCustomTask() {
  const name = document.getElementById('newTaskName').value.trim();
  if (!name) { showToast('请输入任务名称'); return; }
  const modId = document.getElementById('newTaskMod').value;
  const week = parseInt(document.getElementById('newTaskWeek').value);
  const day = parseInt(document.getElementById('newTaskDay').value);
  const status = document.getElementById('newTaskStatus').value;
  const desc = document.getElementById('newTaskDesc').value.trim();
  const mod = MODULES.find(m => m.id === modId);
  const newTask = {
    id: 'custom_' + Date.now(),
    name, desc,
    deps: [], week, day, status,
    custom: true,
  };
  if (!mod) return;
  mod.tasks.push(newTask);
  // 持久化自定义任务，刷新后自动恢复
  appData.customTasks.push({...newTask, modId: modId});
  if (status === 'done') {
    appData.completions[newTask.id] = [`${week}-${day}`];
  }
  closeModal();
  render();
  saveData();
  showToast('✅ 自定义任务已添加: ' + name);
}

function deleteTask(taskId) {
  const task = findTask(taskId);
  if (!task) return;
  if (!confirm(`确定删除任务「${task.name}」？此操作不可撤销。`)) return;
  MODULES.forEach(m => {
    const idx = m.tasks.findIndex(t => t.id === taskId);
    if (idx >= 0) m.tasks.splice(idx, 1);
  });
  // 持久化删除记录，刷新后不再复活
  if (!appData.deletedTasks.includes(taskId)) {
    appData.deletedTasks.push(taskId);
  }
  // 如果是自定义任务，也从持久化列表中移除
  appData.customTasks = appData.customTasks.filter(ct => ct.id !== taskId);
  delete appData.completions[taskId];
  delete appData.notes[taskId];
  closeModal();
  render();
  saveData();
  showToast('已删除: ' + task.name);
}

// ═══════════════════ EXTENDED: Milestone Markers ═══════════════════
const MILESTONES = [
  { week: 2, day: 5, label: 'M1 · 云端向量写入验收' },
  { week: 4, day: 4, label: 'M2 · 真实环境验收' },
  { week: 5, day: 5, label: 'M3 · OpenSpec 收敛' },
];

// ═══════════════════ EXTENDED: Export as Markdown ═══════════════════
function exportMarkdown() {
  let md = `# RAG-Anything 项目进度报告\n\n> 导出时间: ${new Date().toLocaleString()}\n\n`;
  MODULES.forEach(mod => {
    md += `## ${mod.name}\n\n| 任务 | 状态 | 实现完成日期 | 备注 |\n|------|------|-------------|------|\n`;
    mod.tasks.forEach(t => {
      const comps = getTaskCompletion(t.id);
      const statusStr = STATUS_LABELS[getDisplayStatus(t)] || STATUS_LABELS.pending;
      const dateStr = comps.length ? comps.map(c => { const [,w,d] = c.split('-'); return `W${w} ${['一','二','三','四','五'][d-1]}`; }).join(', ') : '-';
      const note = getTaskNote(t.id) || '-';
      md += `| ${t.name} | ${statusStr} | ${dateStr} | ${note} |\n`;
    });
    md += '\n';
  });
  md += `---\n*由 RAG-Anything 项目管理看板自动生成*\n`;
  const blob = new Blob([md], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `rag-progress-${new Date().toISOString().slice(0,10)}.md`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Markdown 报告已导出');
}

// ═══════════════════ INIT ═══════════════════
document.addEventListener('DOMContentLoaded', () => {
  // 主题恢复
  try {
    const saved = localStorage.getItem('raganything_pm_theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch(e) {}

  // 新版看板忽略旧 hash，首次渲染后写入当前数据版本。
  if (!location.hash.slice(1) || hashLoad()?.version !== BOARD_VERSION) {
    hashSave(appData);
  }

  render();
  // Auto-save every 30 seconds（hash 存储总是可用）
  setInterval(() => { saveData(); }, 30000);
});
</script>
