name: Manual lint diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-static-manual:
    name: lint-and-static-manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.6.14'
      - run: uv sync --frozen --all-extras
      - run: |
          uv run ruff check .
          uv run ruff format --check .
          git diff --exit-code
