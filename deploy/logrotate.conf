# RAG-Anything Log Rotation
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/rag-anything
# Test:    sudo logrotate -d /etc/logrotate.d/rag-anything

/opt/rag-anything/logs/*.log {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    dateext
    dateformat -%Y%m%d
    maxsize 50M
    copytruncate
    create 644 www-data www-data
    postrotate
        # Notify the application to reopen log files
        /bin/systemctl kill -s HUP rag-anything.service 2>/dev/null || true
    endscript
}
