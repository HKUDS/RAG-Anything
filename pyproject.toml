[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raganything"
dynamic = ["version"]
authors = [
    {name = "Zirui Guo"}
]
description = "RAGAnything: All-in-One RAG System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncpg>=0.29,<1.0",
    "huggingface_hub",
    "lightrag-hku<1.5",
    "mineru[core]",
    "docling>=2.0,<3.0",
    "pypdf>=3.9.0",
    "tqdm",
    "slowapi>=0.1.9,<0.2",
    "PyJWT>=2.8,<3.0",
    "passlib>=1.7.4,<1.8",
    "python-docx>=1.1,<2.0",
    "pypdfium2>=4.30,<5.0",
    "Markdown>=3.4,<4.0",
    "beautifulsoup4>=4.12,<5.0",
    "aiohttp>=3.9,<4.0",
    "psutil>=5.9",
    "reportlab>=4.0,<5.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0"]
text = ["reportlab>=4.0.0"]
office = []  # Requires LibreOffice (external program)
paddleocr = [
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
    "pypdfium2>=4.25.0",
]
markdown = [
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
]
opendataloader = [
    "opendataloader-pdf==2.5.0",
]
all = [
    "Pillow>=10.0.0",
    "reportlab>=4.0.0",
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",
    "pypdfium2>=4.25.0",
    "markdown>=3.4.0",
    "weasyprint>=60.0",
    "pygments>=2.10.0",
    "opendataloader-pdf==2.5.0",
]

[project.urls]
Homepage = "https://github.com/HKUDS/RAG-Anything"
Documentation = "https://github.com/HKUDS/RAG-Anything"
Repository = "https://github.com/HKUDS/RAG-Anything"
Issues = "https://github.com/HKUDS/RAG-Anything/issues"

[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "pytest-asyncio",
    "black",
    "isort",
    "flake8",
    "mypy",
    "openai",
    "python-dotenv",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["raganything*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "raganything.__version__"}

[tool.ruff]
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# These entry modules must load .env/runtime settings before importing
# dependencies that read configuration at import time.
"server.py" = ["E402"]
"raganything/services/kb_service.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = ["examples"]
